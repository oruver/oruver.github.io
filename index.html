<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オルバー | Profile</title>
  <meta name="description" content="オルバーのプロフィールサイト">
  <style>
    :root {
      --bg: #1f2530;
      --card: rgba(46, 54, 68, 0.78);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f2f4f8;
      --muted: #b4bbc9;
      --accent: #44d62c;
      --accent-2: #2bb3a0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* 背景のぼかしグラデーション */
    .glow {
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.25;
      z-index: 0;
      pointer-events: none;
    }
    .glow.one { background: var(--accent); top: -120px; left: -120px; }
    .glow.two { background: var(--accent-2); bottom: -140px; right: -120px; }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 32px 36px;
      text-align: center;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }

    /* フェードイン */
    .fade {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .fade.show {
      opacity: 1;
      transform: translateY(0);
    }

    .avatar {
      width: 104px;
      height: 104px;
      margin: 0 auto 20px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px rgba(68, 214, 44, 0.6);
    }
    .avatar img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .title {
      margin-top: 4px;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .divider {
      width: 48px;
      height: 3px;
      margin: 24px auto;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }

    .bio {
      font-size: 0.95rem;
      text-align: left;
      color: var(--text);
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
    }
    .tag {
      font-size: 0.8rem;
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
    }

    .links {
      margin-top: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      background: #fff;
      color: #000;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(68, 214, 44, 0.25);
    }
    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    .btn svg { width: 18px; height: 18px; }

    footer {
      margin-top: 28px;
      font-size: 0.75rem;
      color: var(--muted);
    }

    @media (max-width: 480px) {
      .card { padding: 40px 22px 28px; border-radius: 20px; }
      h1 { font-size: 1.6rem; }
      .avatar { width: 88px; height: 88px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fade { transition: none; opacity: 1; transform: none; }
      .btn { transition: none; }
    }
  </style>
</head>
